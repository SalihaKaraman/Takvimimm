name: takvimimm
description: "Minimalist masaüstü takvim ve günlük planlayıcı uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI & İkonlar
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1        # Inter font ailesi için

  # Durum Yönetimi
  provider: ^6.1.2             # ChangeNotifier tabanlı state management

  # Yerel Veri Tabanı
  hive: ^2.2.3                 # Hive NoSQL veritabanı
  hive_flutter: ^1.1.0         # Flutter için Hive entegrasyonu

  # Yardımcı Paketler
  intl: ^0.20.2                # Tarih & saat formatlama
  uuid: ^4.5.3                 # Benzersiz görev ID üretimi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13        # Hive adaptör kodu üretimi
  hive_generator: ^2.0.1       # @HiveType annotasyonlarını işler

flutter:
  uses-material-design: true
